name: osm-check
on:
  push:
    branches: [osm-check]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/osm_fetch.py Q33935
      - uses: actions/upload-artifact@v4
        with:
          name: osm-tlv
          path: |
            osm_stats.json
            osm_places.json
