name: osm-check
on:
  push:
    branches: [osm-check]
    paths: [tools/*.py, .github/workflows/osm-check.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: fetch from OpenStreetMap (only when there is no catalog yet, or when REFETCH is in the commit message)
        if: ${{ hashFiles('data/places-tlv.json') == '' || contains(github.event.head_commit.message, 'REFETCH') }}
        run: python3 tools/osm_fetch.py 32.029,34.739,32.147,34.853 && python3 tools/osm_build.py osm_places.json data/places-tlv.json "תל אביב"
      - run: python3 tools/osm_enrich.py data/places-tlv.json data/enrich-report-tlv.json
      - run: python3 tools/site_check.py data/places-tlv.json data/site-check-tlv.json
      - run: python3 tools/chains.py data/places-tlv.json data/chains-report-tlv.json
      - run: python3 tools/chefs.py data/places-tlv.json tools/chefs-tlv.json
      - run: python3 tools/timeout_scan.py data/places-tlv.json data/timeout-scan-tlv.json 1200 || true
      - run: python3 tools/apply_status.py data/places-tlv.json tools/closed-tlv.json data/site-check-tlv.json
      - run: |
          git config user.name "fomo-bot"; git config user.email "fomo-bot@users.noreply.github.com"
          git add data/ && git commit -m "OSM catalog: Tel Aviv (enriched)" && git pull --rebase && git push
