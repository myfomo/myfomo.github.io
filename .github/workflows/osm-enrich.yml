name: osm-enrich
on:
  push:
    branches: [osm-check]
    paths: [tools/osm_enrich.py, .github/workflows/osm-enrich.yml]
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/osm_enrich.py tlv
      - run: |
          git config user.name "fomo-bot"; git config user.email "fomo-bot@users.noreply.github.com"
          git add data/enrich-tlv.json && git commit -m "OSM catalog: Tel Aviv enrichment (addresses + websites)" && git pull --rebase && git push
